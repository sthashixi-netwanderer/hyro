name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-builds
            build_cmd: dist:linux
          - os: macos-latest
            platform: mac
            artifact_name: macos-builds
            build_cmd: dist:mac
          - os: windows-latest
            platform: win
            artifact_name: windows-builds
            build_cmd: dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          SKIP_YT_DLP_DOWNLOAD: 1

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p resources/bin
          if [ "$RUNNER_OS" = "Linux" ]; then
            curl -L -o resources/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
            chmod +x resources/bin/yt-dlp
          elif [ "$RUNNER_OS" = "macOS" ]; then
            curl -L -o resources/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
            chmod +x resources/bin/yt-dlp
          elif [ "$RUNNER_OS" = "Windows" ]; then
            curl -L -o resources/bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          fi
          echo "yt-dlp downloaded:"
          ls -lh resources/bin/

      - name: Build app
        run: npm run build

      - name: Package app
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: List build outputs
        shell: bash
        run: |
          echo "=== Build outputs ==="
          find release -type f | sort
          echo ""
          echo "=== Output sizes ==="
          du -sh release/* 2>/dev/null || true

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          retention-days: 3

      - name: Upload macOS artifacts
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
          retention-days: 3

      - name: Upload Windows artifacts
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
          retention-days: 3

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | sort
          echo ""
          echo "=== Artifact sizes ==="
          du -sh artifacts/* 2>/dev/null || true

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating log from all commits"
            LOG=$(git log --pretty=format:"- %s (%h)" "$TAG")
          else
            echo "Comparing $PREV_TAG..$TAG"
            LOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$TAG")
          fi

          echo "## What's Changed" > changelog.md
          echo "" >> changelog.md
          echo "$LOG" >> changelog.md

          if [ -n "$PREV_TAG" ]; then
            echo "" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}" >> changelog.md
          fi

          echo "--- Generated changelog ---"
          cat changelog.md

      - name: Compute checksums
        run: |
          echo "## Checksums (SHA-256)" > checksums.md
          echo "" >> checksums.md
          echo '```' >> checksums.md
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) | sort | while read -r f; do
            FILENAME=$(basename "$f")
            HASH=$(sha256sum "$f" | cut -d' ' -f1)
            printf "%s  %s\n" "$HASH" "$FILENAME"
          done >> checksums.md
          echo '```' >> checksums.md

          echo "--- Generated checksums ---"
          cat checksums.md

      - name: Create release body
        run: |
          {
            cat changelog.md
            echo ""
            echo ""
            cat checksums.md
          } > release_body.md

          echo "--- Final release body ---"
          cat release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hyro Music ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          body_path: release_body.md
          files: artifacts/**/*
