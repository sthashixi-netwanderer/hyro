<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title>Hyro Music App Icon</title>
  <defs>
    <!-- Squircle background with subtle depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#1ED760"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.72  0 0 0 0 0.33  0 0 0 0.6 0" />
    </filter>
    <filter id="barShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bgGrad)" />
  <!-- Subtle border -->
  <rect x="0.5" y="0.5" width="1023" height="1023" rx="231.5" ry="231.5" fill="none" stroke="#242424" stroke-opacity="1" stroke-width="1.5"/>
  <!-- Inner highlight edge -->
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="230.5" ry="230.5" fill="none" stroke="#2E2E2E" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Logo mark group centered -->
  <g id="mark" filter="url(#barShadow)">
    <!-- Left bar of H -->
    <rect x="312" y="296" width="92" height="432" rx="28" ry="28" fill="#FFFFFF" />
    <!-- Right bar of H -->
    <rect x="620" y="296" width="92" height="432" rx="28" ry="28" fill="#FFFFFF" />
    <!-- Waveform crossbar — fuses into the H stems -->
    <!-- Glow behind waveform -->
    <path d="M 358 512 L 402 512
             C 432 512 432 404 472 404
             C 512 404 512 620 552 620
             C 592 620 592 512 622 512
             L 666 512"
          fill="none" stroke="#1DB954" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" opacity="0.18" filter="url(#glow)"/>
    <!-- Main waveform -->
    <path d="M 358 512 L 402 512
             C 432 512 432 404 472 404
             C 512 404 512 620 552 620
             C 592 620 592 512 622 512
             L 666 512"
          fill="none" stroke="url(#waveGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center node — the listening point at the flat center -->
    <circle cx="512" cy="512" r="13" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="512" cy="512" r="6" fill="#1DB954"/>
  </g>

  <!-- Subtle bottom reflection for macOS depth (very faint) -->
  <ellipse cx="512" cy="985" rx="280" ry="18" fill="#000000" opacity="0.18"/>
</svg>
